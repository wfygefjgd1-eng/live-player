name: TVPlayer
options:
  bundleIdPrefix: org.tvplayer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 1.0.0

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.3.8"
    CURRENT_PROJECT_VERSION: "2308"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  TVPlayer_iOS:
    type: application
    platform: iOS
    sources:
      - path: TVPlayer_iOS
    dependencies:
      - package: MPVKit
        product: MPVKit
    resources:
      - TVPlayer_iOS/Resources/validated-channels.json
    info:
      path: TVPlayer_iOS/Info.plist
      properties:
        CFBundleDisplayName: TV go
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiredDeviceCapabilities: ["arm64"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIPreferredHomeIndicatorAutoHidden: true
        UIRequiresFullScreen: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        UIInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: "用于加载直播源与频道列表"
        NSAppTransportSecurity:
          # 仅对媒体加载放行 HTTP（iOS 10+ 媒体豁免，专为播放器设计）。
          # 相比 NSAllowsArbitraryLoads=true 的全局豁免，非媒体请求仍受 ATS 保护，
          # App Store 审核更友好。若个别 http 域名仍被拒可加 NSExceptionDomains 白名单。
          NSAllowsArbitraryLoadsForMedia: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        INFOPLIST_FILE: TVPlayer_iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.tvplayer.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

