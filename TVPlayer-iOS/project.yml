name: TVPlayer
options:
  bundleIdPrefix: org.tvplayer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    from: 1.0.0

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.4.3"
    CURRENT_PROJECT_VERSION: "2403"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  TVPlayer_iOS:
    type: application
    platform: iOS
    sources:
      - path: TVPlayer_iOS
    dependencies:
      - package: MPVKit
        product: MPVKit
    resources:
      - TVPlayer_iOS/Resources/validated-channels.json
    info:
      path: TVPlayer_iOS/Info.plist
      properties:
        CFBundleDisplayName: TV go
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIRequiredDeviceCapabilities: ["arm64"]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIPreferredHomeIndicatorAutoHidden: true
        UIRequiresFullScreen: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        UIInterfaceStyle: Dark
        # 声明场景生命周期入口：AppDelegate 用 configurationForConnecting 编程式注册
        # SceneDelegate，但没有 UIApplicationSceneManifest 时系统不会创建 UIWindowScene，
        # 主窗口(installMainWindow)永不触发 → 启动黑屏。此 manifest 必须保留。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        NSLocalNetworkUsageDescription: "用于加载直播源与频道列表"
        NSAppTransportSecurity:
          # 必须全局放行 HTTP：NetworkService 用 URLSession 拉取 m3u 播放列表，
          # 而用户自定义源常是 http 域名（动态、不可枚举）。NSAllowsArbitraryLoadsForMedia
          # 只豁免 AVFoundation 媒体连接，不豁免 URLSession 的普通请求 —— 收窄会导致
          # 自定义 http m3u 源加载不到频道（v2.3.8 实测回归）。自签侧载场景审核风险可忽略。
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        INFOPLIST_FILE: TVPlayer_iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: org.tvplayer.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

