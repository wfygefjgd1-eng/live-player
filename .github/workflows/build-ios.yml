name: Build iOS App

on:
  push:
    tags:
      - 'v*-ios'
    branches: [main, master]
    paths:
      - 'TVPlayer-iOS/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'TVPlayer-iOS/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: TVPlayer-iOS

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App (SPM resolves MPVKit)
        run: |
          xcodebuild \
            -project TVPlayer.xcodeproj \
            -scheme TVPlayer_iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TVPlayer.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify app version in Info.plist
        run: |
          APP=build/TVPlayer.xcarchive/Products/Applications/TVPlayer_iOS.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          EXPECTED=$(grep 'MARKETING_VERSION:' project.yml | tail -1 | sed 's/.*"\(.*\)".*/\1/')
          test "$VER" = "$EXPECTED"

      - name: Verify libmpv linked into app
        run: |
          APP=build/TVPlayer.xcarchive/Products/Applications/TVPlayer_iOS.app
          if [ ! -d "$APP" ]; then
            echo "ERROR: $APP not found"
            find build/TVPlayer.xcarchive -name "*.app"
            exit 1
          fi
          BIN="$APP/TVPlayer_iOS"
          if strings -a "$BIN" 2>/dev/null | grep -Eq 'mpv 0\.41\.0|libmpv'; then
            echo "OK: libmpv (MPVKit 0.41.0) linked into app binary"
          else
            # Release 构建剥离符号后字符串也可能缺失：用体积兜底（libmpv+FFmpeg 静态链接约 +25MB）
            SIZE=$(du -m "$BIN" | cut -f1)
            if [ "${SIZE:-0}" -lt 20 ]; then
              echo "ERROR: no libmpv strings and binary only ${SIZE}MB - MPVKit not linked"
              strings -a "$BIN" 2>/dev/null | grep -i mpv | head -5
              exit 1
            fi
            echo "OK: binary ${SIZE}MB (size indicates MPVKit linked)"
          fi
          du -sh "$APP"

      - name: Get version
        id: get_version
        env:
          # github.ref 经 env 传入再比较：直接内插进 bash 会被 tag 名注入命令
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-ios}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            # 优先读 target 级 MARKETING_VERSION（最后一次出现）
            VERSION=$(grep 'MARKETING_VERSION:' project.yml | tail -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Export IPA
        run: |
          mkdir -p build/Payload
          cp -r build/TVPlayer.xcarchive/Products/Applications/TVPlayer_iOS.app build/Payload/
          cd build
          zip -r TV-go-v${{ steps.get_version.outputs.version }}-ios.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TV-go-iOS
          path: TVPlayer-iOS/build/TV-go-v${{ steps.get_version.outputs.version }}-ios.ipa
          retention-days: 7

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        # job 级默认 working-directory 是 TVPlayer-iOS，release notes 在仓库根目录
        working-directory: .
        run: |
          NOTES="RELEASE_NOTES_iOS_v${{ steps.get_version.outputs.version }}.md"
          if [ -f "$NOTES" ]; then
            echo "notes_path=$NOTES" >> $GITHUB_OUTPUT
          else
            echo "notes_path=" >> $GITHUB_OUTPUT
            echo "No release notes file for v${{ steps.get_version.outputs.version }}, falling back to generated notes"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: TVPlayer-iOS/build/TV-go-v${{ steps.get_version.outputs.version }}-ios.ipa
          body_path: ${{ steps.notes.outputs.notes_path }}
          name: TV go iOS v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
