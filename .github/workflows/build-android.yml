name: Build Android APK

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-native

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Get version
        id: ver
        working-directory: .
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-android}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep versionName android-native/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 写入 android-native/release.keystore；KEYSTORE_FILE 相对 rootProject（即 android-native/）解析
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Assemble Release
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found: $APK"
          OUT="TV-go-v${{ steps.ver.outputs.version }}-android-arm64.apk"
          cp "$APK" "$GITHUB_WORKSPACE/$OUT"
          echo "file=$OUT" >> $GITHUB_OUTPUT
          ls -la "$GITHUB_WORKSPACE/$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-go-Android-arm64
          path: ${{ github.workspace }}/${{ steps.apk.outputs.file }}

      - name: Check release notes
        id: notes
        working-directory: .
        run: |
          NOTES="RELEASE_NOTES_Android_v${{ steps.ver.outputs.version }}.md"
          if [ -f "$NOTES" ]; then
            echo "notes_path=$NOTES" >> $GITHUB_OUTPUT
          else
            echo "notes_path=" >> $GITHUB_OUTPUT
            echo "No release notes file for v${{ steps.ver.outputs.version }}, falling back to generated notes"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/${{ steps.apk.outputs.file }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          name: TV go Android ARM64 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
