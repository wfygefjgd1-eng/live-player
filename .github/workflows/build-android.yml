name: Build Android APK

on:
  push:
    tags:
      - 'v*-android'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android-native
    # secrets 必须提升到 job 级 env：步骤级 if 的 env 上下文读不到本步骤自己的 env 块，
    # 写在步骤里会导致 `if: env.KEYSTORE_BASE64 != ''` 恒为 false、签名步骤被静默跳过
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Get version
        id: ver
        working-directory: .
        env:
          # github.ref 经 env 传入再比较：直接内插进 bash 会被 tag 名注入命令
          GIT_REF: ${{ github.ref }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            VERSION=${VERSION%-android}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep versionName android-native/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # 写入 android-native/release.keystore；KEYSTORE_FILE 相对 rootProject（即 android-native/）解析
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Assemble Release
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Verify APK is release-signed (fail on debug cert)
        run: |
          APK=$(find app/build/outputs/apk -name "*-release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no release APK found"; exit 1
          fi
          BT=$(ls -d "${ANDROID_HOME}/build-tools/"*/ | sort -V | tail -1)
          # 先独立校验 apksigner 退出码：管道接 grep 会吞掉 apksigner 的失败
          #（未签名/损坏 APK 时 stdout 为空、grep 无匹配，旧写法会误判为 release-signed）
          if ! "$BT/apksigner" verify --print-certs "$APK" > /tmp/certs.txt 2>&1; then
            echo "ERROR: apksigner verify failed — APK is unsigned or corrupt, refusing to publish"
            cat /tmp/certs.txt
            exit 1
          fi
          if grep -qi "Android Debug" /tmp/certs.txt; then
            echo "ERROR: APK is debug-signed — refusing to publish"
            cat /tmp/certs.txt
            exit 1
          fi
          echo "OK: APK is release-signed"
          head -3 /tmp/certs.txt

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found: $APK"
          OUT="TV-go-v${{ steps.ver.outputs.version }}-android-arm64.apk"
          cp "$APK" "$GITHUB_WORKSPACE/$OUT"
          echo "file=$OUT" >> $GITHUB_OUTPUT
          ls -la "$GITHUB_WORKSPACE/$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TV-go-Android-arm64
          path: ${{ github.workspace }}/${{ steps.apk.outputs.file }}

      - name: Check release notes
        id: notes
        working-directory: .
        run: |
          NOTES="RELEASE_NOTES_Android_v${{ steps.ver.outputs.version }}.md"
          if [ -f "$NOTES" ]; then
            echo "notes_path=$NOTES" >> $GITHUB_OUTPUT
          else
            echo "notes_path=" >> $GITHUB_OUTPUT
            echo "No release notes file for v${{ steps.ver.outputs.version }}, falling back to generated notes"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ github.workspace }}/${{ steps.apk.outputs.file }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          name: TV go Android ARM64 v${{ steps.ver.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
