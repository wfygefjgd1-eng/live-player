plugins {
    id 'com.android.application'
}

// CI 通过环境变量注入正式 keystore（见 .github/workflows/build-android.yml）；
// release 构建缺 keystore 时直接失败——绝不悄悄退回 debug 签名（debug 包不可分发）
def ksPath = System.getenv("KEYSTORE_FILE")
def ksFile = (ksPath != null && !ksPath.trim().isEmpty()) ? rootProject.file(ksPath) : null
def hasReleaseKeystore = ksFile != null && ksFile.exists()

def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (releaseTaskRequested && !hasReleaseKeystore) {
    throw new GradleException(
        "Release build requires a signing keystore: KEYSTORE_FILE/KEYSTORE_PASSWORD/" +
        "KEY_ALIAS/KEY_PASSWORD must be set (CI injects them from repo secrets). " +
        "Refusing to fall back to debug signing — run assembleDebug for local testing.")
}

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "org.tvplayer.app"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 25
        versionName "2.0.5"
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a"
        }
        setProperty("archivesBaseName", "TV-go-android-arm64-v${versionName}")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "TV-go-v${variant.versionName}-android-arm64-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
}
