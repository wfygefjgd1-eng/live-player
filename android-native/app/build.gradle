plugins {
    id 'com.android.application'
}

// CI 通过环境变量注入正式 keystore（见 .github/workflows/build-android.yml）；
// 无密钥时回退 debug 签名，保证 release 产物可直接安装（未签名 APK 真机装不上）
def ksPath = System.getenv("KEYSTORE_FILE")
def ksFile = (ksPath != null && !ksPath.trim().isEmpty()) ? rootProject.file(ksPath) : null
def hasReleaseKeystore = ksFile != null && ksFile.exists()

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "org.tvplayer.app"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 25
        versionName "2.0.5"
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a"
        }
        setProperty("archivesBaseName", "TV-go-android-arm64-v${versionName}")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "TV-go-v${variant.versionName}-android-arm64-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
}
